{# Reusable create/edit modal. Submission is handled by fetch() against the API. #}
<div id="{{ modal_id }}" class="project-form-modal" popover="auto" role="dialog"
  aria-modal="true" aria-labelledby="{{ modal_id }}-title">
  <button type="button" class="project-form-modal__backdrop"
    popovertarget="{{ modal_id }}" popovertargetaction="hide"
    aria-label="Tutup form pengalaman"></button>
  <div class="project-form-modal__content">
    <div class="modal-heading">
      <span class="modal-heading__icon" aria-hidden="true">✦</span>
      <div>
        <p class="modal-eyebrow">Career timeline</p>
        <h2 id="{{ modal_id }}-title">{{ modal_title }}</h2>
      </div>
      <button type="button" class="project-form-modal__close"
        popovertarget="{{ modal_id }}" popovertargetaction="hide"
        aria-label="Tutup form pengalaman">×</button>
    </div>
    <p class="modal-introduction">{{ modal_introduction }}</p>
    <form id="{{ form_id }}" class="project-form" novalidate>
      <div class="modal-form-grid">
        {% for field in modal_form %}
        <div class="form-group{% if field.name == 'description' %} form-group--wide{% endif %}">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
        </div>
        {% endfor %}
      </div>
      <div class="project-form-modal__actions">
        <button type="button" class="button button-ghost"
          popovertarget="{{ modal_id }}" popovertargetaction="hide">Batal</button>
        <button type="submit" class="button button-submit">
          <span class="button-submit__label">{{ submit_label }}</span>
          <span class="button-submit__spinner component-spinner" aria-hidden="true"></span>
        </button>
      </div>
    </form>
  </div>
</div>
