<div id="{{ modal_id }}" class="modal modal--lg" popover="auto" role="dialog"
  aria-labelledby="{{ modal_id }}-title">
  <div class="modal__header">
    <span class="modal__icon"><svg class="icon icon--lg" aria-hidden="true"><use href="#i-{{ modal_icon|default:'briefcase' }}"/></svg></span>
    <div class="modal__titles">
      <p class="modal__eyebrow">Career Timeline</p>
      <h2 id="{{ modal_id }}-title" class="modal__title">{{ modal_title }}</h2>
    </div>
    <button type="button" class="icon-btn" popovertarget="{{ modal_id }}"
      popovertargetaction="hide" aria-label="Tutup form pengalaman">
      <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
    </button>
  </div>
  <div class="modal__body">
    <p class="modal__intro">{{ modal_introduction }}</p>
    <form id="{{ form_id }}" novalidate>
      <div class="form-grid">
        {% for field in modal_form %}
        <div class="form-group{% if field.name == 'description' %} form-group--wide{% endif %}">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
        </div>
        {% endfor %}
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--ghost" popovertarget="{{ modal_id }}"
          popovertargetaction="hide">Cancel</button>
        <button type="submit" class="btn">
          <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>{{ submit_label }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
