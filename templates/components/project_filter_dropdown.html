<div class="dropdown-field">
  <label class="sr-only" for="project-type">Filter project type</label>
  <select id="project-type" name="type" aria-label="Filter project type">
    <option value="">All type</option>
    {% for value, label in form.fields.type.choices %}
    <option value="{{ value }}">{{ label }}</option>
    {% endfor %}
  </select>
</div>
