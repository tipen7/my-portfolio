{% if user.is_authenticated %}
<form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form">
  {% csrf_token %}
  <button type="submit"
    class="button button-star{% if user in project.starred_by.all %} is-starred{% endif %}"
    title="{% if user in project.starred_by.all %}Batalkan star{% else %}Beri star{% endif %}"
    aria-label="{% if user in project.starred_by.all %}Batalkan star{% else %}Beri star{% endif %} {{ project.name }}">
    <span class="button-star__icon" aria-hidden="true">★</span>
    <span>{% if user in project.starred_by.all %}Unstar{% else %}Star{% endif %}</span>
    <span class="star-count" aria-label="{{ project.starred_by.count }} stars">{{ project.starred_by.count }}</span>
  </button>
</form>
{% else %}
<a class="button button-star" href="{% url 'main:login' %}?next={{ request.path }}"
  aria-label="Login to star {{ project.name }}">
  <span class="button-star__icon" aria-hidden="true">★</span>
  <span>Login to star</span>
  <span class="star-count" aria-label="{{ project.starred_by.count }} stars">{{ project.starred_by.count }}</span>
</a>
{% endif %}
