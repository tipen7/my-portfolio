<button type="button" class="button button-danger modal-trigger"
  popovertarget="delete-project-{{ project.id }}"
  aria-label="Hapus {{ project.name }}" aria-haspopup="dialog">
  <span aria-hidden="true">⌫</span> Hapus Proyek
</button>
<div id="delete-project-{{ project.id }}" class="project-delete-modal" popover="auto"
  role="dialog" aria-modal="true" aria-labelledby="delete-project-title-{{ project.id }}">
  <button type="button" class="project-delete-modal__backdrop"
    popovertarget="delete-project-{{ project.id }}" popovertargetaction="hide"
    aria-label="Tutup konfirmasi hapus"></button>
  <div class="project-delete-modal__content">
    <button type="button" class="project-delete-modal__close"
      popovertarget="delete-project-{{ project.id }}" popovertargetaction="hide"
      aria-label="Tutup konfirmasi hapus">×</button>
    <div class="delete-modal__header">
      <span class="delete-modal__icon" aria-hidden="true">!</span>
      <div>
        <p class="delete-modal__eyebrow">Irreversible action</p>
        <h2 id="delete-project-title-{{ project.id }}">Hapus Proyek?</h2>
      </div>
    </div>
    <p class="delete-modal__message">Proyek ini akan dihapus secara permanen dan tidak dapat dipulihkan.</p>
    <p class="delete-modal__item"><span aria-hidden="true">↳</span> {{ project.name }}</p>
    <div class="project-delete-modal__actions">
      <button type="button" class="button button-ghost"
        popovertarget="delete-project-{{ project.id }}" popovertargetaction="hide">Batal</button>
      <form method="post" action="{% url 'main:delete_project' project.id %}">
        {% csrf_token %}
        <button type="submit" class="button button-danger">Ya, Hapus Proyek</button>
      </form>
    </div>
  </div>
</div>
